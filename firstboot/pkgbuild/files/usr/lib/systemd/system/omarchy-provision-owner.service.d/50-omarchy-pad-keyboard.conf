# Omarchy Pad: the owner setup by touch. The touch form (omarchy-pad-owner-form.service) comes up first and answers the
# setup's questions through the stand-in gum on the form's PATH (/usr/lib/omarchy-pad/owner-path/gum); without it, the
# touch keyboard (omarchy-pad-owner-keyboard.service) comes up under the text form. Both end when the form is done,
# back on tty1 before SDDM takes the screen. The form's setfont is Omarchy Pad's too
# (/usr/lib/omarchy-pad/owner-path/setfont), which has the keyboard take its rows back after each font change.
[Unit]
Wants=omarchy-pad-owner-form.service
Wants=omarchy-pad-owner-keyboard.service
After=omarchy-pad-owner-form.service omarchy-pad-owner-keyboard.service

[Service]
Environment=PATH=/usr/lib/omarchy-pad/owner-path:/usr/local/sbin:/usr/local/bin:/usr/bin
# Nothing is asked before the touch form is up, or known not to come up
ExecStartPre=-/usr/lib/omarchy-pad/owner-form-up
ExecStartPost=-/usr/bin/systemctl --no-block stop omarchy-pad-owner-form.service omarchy-pad-owner-keyboard.service
ExecStartPost=-/usr/bin/chvt 1
ExecStopPost=-/usr/bin/systemctl --no-block stop omarchy-pad-owner-form.service omarchy-pad-owner-keyboard.service
ExecStopPost=-/usr/bin/chvt 1
