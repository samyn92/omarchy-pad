# Omarchy Pad: the owner setup brings its touch keyboard (omarchy-pad-owner-keyboard.service) and ends it when the form
# is done, before SDDM takes the screen. The form's setfont is Omarchy Pad's (/usr/lib/omarchy-pad/owner-path/setfont),
# which has the keyboard take its rows back after each font change, so the form stays above the keyboard.
[Unit]
Wants=omarchy-pad-owner-keyboard.service
After=omarchy-pad-owner-keyboard.service

[Service]
Environment=PATH=/usr/lib/omarchy-pad/owner-path:/usr/local/sbin:/usr/local/bin:/usr/bin
ExecStartPost=-/usr/bin/systemctl --no-block stop omarchy-pad-owner-keyboard.service
ExecStopPost=-/usr/bin/systemctl --no-block stop omarchy-pad-owner-keyboard.service
