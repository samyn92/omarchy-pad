# Omarchy Pad: Omarchy's Bluetooth pairing agent waits for BlueZ instead of skipping itself.
#
# Omarchy's bt-agent.service starts with the graphical session and skips itself unless bluetooth.service is already
# active. On a tablet, bluetoothd can come up a few seconds after the session (on the OnePlus Pad 4 it waits for the
# device layer to set the adapter's address), so the agent was skipped for the whole login and nothing answered a
# device's pairing request: a Logitech Lift connected but never paired, and never moved the pointer (14 Nov 2026).
# So it only asks that Bluetooth is enabled at all, and waits for bluetoothd on the system bus before it registers.
[Service]
ExecCondition=
ExecCondition=/usr/bin/systemctl is-enabled --quiet bluetooth.service
ExecStartPre=/usr/bin/gdbus wait --system --timeout 60 org.bluez
